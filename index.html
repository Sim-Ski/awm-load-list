<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWM Digital Load List v1.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            background-image:
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 200, 255, 0.1) 0%, transparent 50%);
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow:
                0 32px 64px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
            color: white;
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.3;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
            position: relative;
            z-index: 1;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
            font-weight: 400;
            position: relative;
            z-index: 1;
        }

        .upload-section {
            padding: 40px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            padding: 18px 36px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow:
                0 10px 25px rgba(99, 102, 241, 0.3),
                0 4px 12px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .file-input-wrapper:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow:
                0 20px 40px rgba(99, 102, 241, 0.4),
                0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .file-input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            top: 0;
            left: 0;
        }

        .progress-bar {
            margin: 24px 0 0;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #d946ef);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: shimmer 2s infinite linear;
        }

        @keyframes shimmer {
            0% { background-position: -200px 0; }
            100% { background-position: 200px 0; }
        }

        .stats {
            display: none;
            justify-content: space-around;
            padding: 24px;
            background: rgba(0, 0, 0, 0.3);
            margin: 24px 40px 12px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat {
            text-align: center;
            padding: 12px;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.875rem;
            margin-top: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .action-bar {
            display: none;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin: 0 40px 8px;
        }

        .btn-action {
            padding: 12px 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.02em;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-report { background: rgba(99, 102, 241, 0.8); border-color: rgba(99,102,241,0.3); }
        .btn-report:hover { background: rgba(99, 102, 241, 1); }
        .btn-csv { background: rgba(20, 184, 166, 0.8); border-color: rgba(20,184,166,0.3); }
        .btn-csv:hover { background: rgba(20, 184, 166, 1); }
        .btn-clear { background: rgba(239, 68, 68, 0.15); border-color: rgba(239,68,68,0.3); color:#fca5a5; }
        .btn-clear:hover { background: rgba(239, 68, 68, 0.3); color:#fff; }

        .save-note {
            margin: 0 40px 16px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.45);
            display: none;
        }
        .save-note strong { color: rgba(255,255,255,0.7); font-weight: 600; }

        .job-ref {
            display: none;
            align-items: center;
            gap: 12px;
            margin: 20px 40px 0;
        }
        .job-ref label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
        }
        .job-ref input {
            flex: 1;
            max-width: 280px;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .job-ref input:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .job-ref input::placeholder { color: rgba(255, 255, 255, 0.4); }

        .items-container {
            padding: 0 40px 40px;
            max-height: 600px;
            overflow-y: auto;
        }

        .items-container::-webkit-scrollbar {
            width: 8px;
        }

        .items-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .items-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .items-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .item-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 4px solid #6366f1;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .item-card:hover {
            transform: translateY(-2px);
            box-shadow:
                0 16px 48px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border-left-color: #8b5cf6;
        }

        .item-card.completed {
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.05);
        }

        .item-card.partially-picked {
            border-left-color: #f59e0b;
            background: rgba(245, 158, 11, 0.05);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
        }

        .item-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            flex: 1;
            letter-spacing: -0.01em;
        }

        .item-status {
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .status-pending {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .status-completed {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-partial {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .item-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }

        .item-details strong {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
        }

        .item-controls {
            display: none;
            grid-template-columns: 1fr auto auto;
            gap: 12px;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .item-controls.active {
            display: grid;
        }

        .quantity-input {
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .quantity-input:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .quantity-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            backdrop-filter: blur(10px);
        }

        .btn-photo {
            background: rgba(20, 184, 166, 0.8);
            color: white;
            border: 1px solid rgba(20, 184, 166, 0.3);
        }

        .btn-photo:hover {
            background: rgba(20, 184, 166, 1);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(20, 184, 166, 0.3);
        }

        .btn-complete {
            background: rgba(16, 185, 129, 0.8);
            color: white;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .btn-complete:hover {
            background: rgba(16, 185, 129, 1);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        .photo-preview {
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .photo-preview img {
            max-width: 200px;
            max-height: 150px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .camera-input {
            display: none;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 24px;
            opacity: 0.7;
        }

        .empty-state h3 {
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }

            .header h1 {
                font-size: 1.75rem;
            }

            .stats {
                margin: 20px 20px 10px;
                padding: 16px;
            }

            .stat-number {
                font-size: 1.75rem;
            }

            .action-bar, .save-note, .job-ref {
                margin-left: 20px;
                margin-right: 20px;
            }

            .items-container {
                padding: 0 20px 20px;
            }

            .item-details {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .item-controls {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ AWM Digital Load List v1.0</h1>
            <p>Advanced warehouse management &amp; order fulfillment</p>
        </div>

        <div class="upload-section">
            <label class="file-input-wrapper">
                <input type="file" class="file-input" accept=".xlsx,.xls" />
                📁 Import Load List
            </label>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-number" id="totalItems">0</div>
                <div class="stat-label">Total Items</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="completedItems">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="remainingItems">0</div>
                <div class="stat-label">Remaining</div>
            </div>
        </div>

        <div class="job-ref" id="jobRefRow">
            <label for="jobRefInput">Job / Ref No.</label>
            <input id="jobRefInput" type="text" placeholder="e.g. S260210" oninput="updateJobRef(this.value)" />
        </div>

        <div class="action-bar" id="actionBar">
            <button class="btn-action btn-report" onclick="exportReport()">📄 Export Report</button>
            <button class="btn-action btn-csv" onclick="exportCSV()">📊 Export CSV</button>
            <button class="btn-action btn-clear" onclick="clearList()">🗑 New List</button>
        </div>

        <div class="save-note" id="saveNote"></div>

        <div class="items-container">
            <div class="empty-state">
                <div class="empty-icon">📋</div>
                <h3>No items loaded</h3>
                <p>Import a load list to start picking items</p>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'awm_load_list_v1';
        let items = [];
        let completedCount = 0;
        let importedFileName = '';
        let jobRef = '';
        let savedAt = null;
        let storageWarned = false;

        const fileInput = document.querySelector('.file-input');
        const progressBar = document.querySelector('.progress-bar');
        const progressFill = document.querySelector('.progress-fill');
        const itemsContainer = document.querySelector('.items-container');
        const stats = document.querySelector('.stats');
        const actionBar = document.getElementById('actionBar');
        const saveNote = document.getElementById('saveNote');
        const jobRefRow = document.getElementById('jobRefRow');
        const jobRefInput = document.getElementById('jobRefInput');
        const totalItemsEl = document.getElementById('totalItems');
        const completedItemsEl = document.getElementById('completedItems');
        const remainingItemsEl = document.getElementById('remainingItems');

        fileInput.addEventListener('change', handleFileUpload);

        /* ---------- Import ---------- */
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            importedFileName = file.name;
            progressBar.style.display = 'block';
            progressFill.style.width = '0%';

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    progressFill.style.width = '50%';
                    const workbook = XLSX.read(e.target.result, { type: 'binary' });
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    const data = XLSX.utils.sheet_to_json(worksheet);

                    progressFill.style.width = '75%';
                    processData(data);

                    progressFill.style.width = '100%';
                    setTimeout(() => { progressBar.style.display = 'none'; }, 500);
                } catch (error) {
                    alert('Error reading Excel file. Please make sure it\'s a valid Excel file.');
                    progressBar.style.display = 'none';
                }
            };
            reader.readAsBinaryString(file);
        }

        function processData(data) {
            items = data.map((row, index) => ({
                id: index,
                name: row.Item || row.item || row.Name || row.name || row.Product || row.product || Object.values(row)[0] || `Item ${index + 1}`,
                description: row.Description || row.description || row.Details || row.details || '',
                quantity: row.Quantity || row.quantity || row.Qty || row.qty || 1,
                location: row.Location || row.location || row.Zone || row.zone || '',
                sku: row.SKU || row.sku || row.Code || row.code || '',
                status: 'pending', // pending, partial, completed
                pickedQuantity: 0,
                photo: null
            }));

            completedCount = 0;
            jobRef = '';
            jobRefInput.value = '';
            renderItems();
            updateStats();
            stats.style.display = 'flex';
            actionBar.style.display = 'flex';
            jobRefRow.style.display = 'flex';
            saveState();
        }

        function updateJobRef(value) {
            jobRef = value;
            saveState();
        }

        /* ---------- Rendering ---------- */
        function renderItems() {
            if (items.length === 0) {
                itemsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📋</div>
                        <h3>No items loaded</h3>
                        <p>Import a load list to start picking items</p>
                    </div>
                `;
                return;
            }

            itemsContainer.innerHTML = items.map(item => {
                let statusClass = 'status-pending';
                let statusText = 'Pending';
                let cardClass = '';

                if (item.status === 'completed') {
                    statusClass = 'status-completed';
                    statusText = 'Completed';
                    cardClass = 'completed';
                } else if (item.status === 'partial') {
                    statusClass = 'status-partial';
                    statusText = 'Partially Picked';
                    cardClass = 'partially-picked';
                }

                return `
                <div class="item-card ${cardClass}" onclick="toggleItemDetails(${item.id})">
                    <div class="item-header">
                        <div class="item-name">${escapeHtml(item.name)}</div>
                        <div class="item-status ${statusClass}">
                            ${statusText}
                        </div>
                    </div>

                    <div class="item-details">
                        <div><strong>Required Quantity:</strong> ${item.quantity}</div>
                        <div><strong>SKU:</strong> ${escapeHtml(item.sku) || 'N/A'}</div>
                        <div><strong>Location:</strong> ${escapeHtml(item.location) || 'N/A'}</div>
                        <div><strong>Picked:</strong> ${item.pickedQuantity}</div>
                    </div>

                    ${item.description ? `<div style="margin-top: 12px; font-style: italic; color: rgba(255, 255, 255, 0.6); font-size: 0.875rem;">${escapeHtml(item.description)}</div>` : ''}

                    <div class="item-controls" id="controls-${item.id}">
                        <input
                            type="number"
                            inputmode="numeric"
                            class="quantity-input"
                            placeholder="Picked quantity"
                            value="${item.pickedQuantity || ''}"
                            onchange="updatePickedQuantity(${item.id}, this.value)"
                            onclick="event.stopPropagation()"
                        />
                        <button class="btn btn-photo" onclick="takePhoto(${item.id}); event.stopPropagation();">
                            📷 Photo
                        </button>
                        <button class="btn btn-complete" onclick="completeItem(${item.id}); event.stopPropagation();">
                            ✓ Complete
                        </button>
                    </div>

                    <div class="photo-preview" id="photo-${item.id}" ${item.photo ? 'style="display:block;"' : ''}>
                        ${item.photo ? `<img src="${item.photo}" alt="Item photo" />` : ''}
                    </div>

                    <input type="file" class="camera-input" id="camera-${item.id}" accept="image/*" capture="environment" onchange="handlePhotoCapture(${item.id}, event)" />
                </div>
            `}).join('');
        }

        function toggleItemDetails(itemId) {
            const controls = document.getElementById(`controls-${itemId}`);
            const isActive = controls.classList.contains('active');
            document.querySelectorAll('.item-controls').forEach(c => c.classList.remove('active'));
            if (!isActive) controls.classList.add('active');
        }

        function updatePickedQuantity(itemId, quantity) {
            const item = items.find(i => i.id === itemId);
            if (item) {
                item.pickedQuantity = parseInt(quantity) || 0;
                saveState();
            }
        }

        /* ---------- Photos (downscaled to keep storage small) ---------- */
        function takePhoto(itemId) {
            document.getElementById(`camera-${itemId}`).click();
        }

        function handlePhotoCapture(itemId, event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const maxDim = 1280;
                    let w = img.width, h = img.height;
                    if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
                    else if (h >= w && h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }

                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    let dataUrl;
                    try { dataUrl = canvas.toDataURL('image/jpeg', 0.7); }
                    catch (err) { dataUrl = e.target.result; }

                    const item = items.find(i => i.id === itemId);
                    if (item) {
                        item.photo = dataUrl;
                        const preview = document.getElementById(`photo-${itemId}`);
                        preview.innerHTML = `<img src="${dataUrl}" alt="Item photo" />`;
                        preview.style.display = 'block';
                        saveState();
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function completeItem(itemId) {
            const item = items.find(i => i.id === itemId);
            if (!item) return;

            if (item.pickedQuantity === 0) {
                alert('Please enter the picked quantity before completing.');
                return;
            }

            const wasCompleted = item.status === 'completed';
            if (item.pickedQuantity >= item.quantity) {
                item.status = 'completed';
                if (!wasCompleted) completedCount++;
            } else {
                item.status = 'partial';
                if (wasCompleted) completedCount--;
            }

            renderItems();
            updateStats();
            saveState();
        }

        function updateStats() {
            totalItemsEl.textContent = items.length;
            completedItemsEl.textContent = completedCount;
            remainingItemsEl.textContent = items.length - completedCount;
        }

        /* ---------- Auto-save (localStorage) ---------- */
        function saveState() {
            savedAt = Date.now();
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    items, completedCount, importedFileName, jobRef, savedAt
                }));
                updateSaveNote();
            } catch (e) {
                updateSaveNote(true);
                if (!storageWarned) {
                    storageWarned = true;
                    alert('Could not auto-save — this device\'s storage may be full (too many/large photos). Export your report so you don\'t lose progress.');
                }
            }
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return false;
                const data = JSON.parse(raw);
                if (!data.items || !data.items.length) return false;
                items = data.items;
                completedCount = typeof data.completedCount === 'number'
                    ? data.completedCount
                    : items.filter(i => i.status === 'completed').length;
                importedFileName = data.importedFileName || '';
                jobRef = data.jobRef || '';
                jobRefInput.value = jobRef;
                savedAt = data.savedAt || null;
                renderItems();
                updateStats();
                stats.style.display = 'flex';
                actionBar.style.display = 'flex';
                jobRefRow.style.display = 'flex';
                updateSaveNote();
                return true;
            } catch (e) { return false; }
        }

        function updateSaveNote(failed) {
            saveNote.style.display = 'block';
            if (failed) {
                saveNote.innerHTML = '⚠️ <strong>Auto-save unavailable</strong> on this device — export regularly to keep a record.';
                return;
            }
            const when = savedAt ? new Date(savedAt).toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' }) : '';
            const src = importedFileName ? `<strong>${escapeHtml(importedFileName)}</strong> · ` : '';
            saveNote.innerHTML = `${src}Progress auto-saves on this device${when ? ' · last saved ' + when : ''}.`;
        }

        function clearList() {
            if (!confirm('Clear the current load list and start a new one? Export first if you need a record — this cannot be undone.')) return;
            items = [];
            completedCount = 0;
            importedFileName = '';
            jobRef = '';
            jobRefInput.value = '';
            savedAt = null;
            try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
            renderItems();
            updateStats();
            stats.style.display = 'none';
            actionBar.style.display = 'none';
            jobRefRow.style.display = 'none';
            saveNote.style.display = 'none';
            fileInput.value = '';
        }

        /* ---------- Export ---------- */
        function statusLabel(s) {
            if (s === 'completed') return 'Completed';
            if (s === 'partial') return 'Partially Picked';
            return 'Pending';
        }

        function fileStamp() {
            const d = new Date();
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
        }

        function baseName() {
            const src = jobRef || importedFileName || 'load-list';
            const n = src.replace(/\.[^.]+$/, '').replace(/[^a-z0-9_-]+/gi, '_');
            return n || 'load-list';
        }

        function downloadBlob(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1500);
        }

        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function csvCell(v) {
            return `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
        }

        function exportCSV() {
            if (!items.length) { alert('Nothing to export yet.'); return; }
            const rows = [
                ['Job / Ref No.', jobRef || ''],
                ['Source file', importedFileName || ''],
                ['Generated', new Date().toLocaleString('en-AU')],
                [],
                ['Item', 'SKU', 'Location', 'Required Qty', 'Picked Qty', 'Status']
            ];
            items.forEach(i => rows.push([i.name, i.sku || '', i.location || '', i.quantity, i.pickedQuantity, statusLabel(i.status)]));
            const csv = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
            downloadBlob('﻿' + csv, `${baseName()}_pick_${fileStamp()}.csv`, 'text/csv;charset=utf-8');
        }

        function exportReport() {
            if (!items.length) { alert('Nothing to export yet.'); return; }
            const generated = new Date().toLocaleString('en-AU');
            const total = items.length;
            const completed = items.filter(i => i.status === 'completed').length;
            const partial = items.filter(i => i.status === 'partial').length;
            const pending = items.filter(i => i.status === 'pending').length;

            const rowsHtml = items.map(i => {
                const cls = i.status === 'completed' ? 'ok' : i.status === 'partial' ? 'part' : 'pend';
                return `<tr>
                    <td>${escapeHtml(i.name)}</td>
                    <td>${escapeHtml(i.sku) || '—'}</td>
                    <td>${escapeHtml(i.location) || '—'}</td>
                    <td class="num">${i.quantity}</td>
                    <td class="num">${i.pickedQuantity}</td>
                    <td><span class="badge ${cls}">${statusLabel(i.status)}</span></td>
                </tr>`;
            }).join('');

            const withPhotos = items.filter(i => i.photo);
            const photosHtml = withPhotos.length
                ? withPhotos.map(i => `<div class="pcard"><img src="${i.photo}" alt=""><div class="pcap">${escapeHtml(i.name)}${i.sku ? ' · ' + escapeHtml(i.sku) : ''}</div></div>`).join('')
                : '<p class="muted">No photos were captured for this load list.</p>';

            const html = `<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWM Pick Report — ${escapeHtml(jobRef || importedFileName || 'Load List')}</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1a1a1a;margin:0;padding:32px;background:#fff;}
  h1{font-size:1.5rem;margin:0 0 4px;color:#4f46e5;}
  h2{font-size:1.05rem;margin:28px 0 10px;border-bottom:2px solid #e5e7eb;padding-bottom:6px;}
  .meta{color:#555;font-size:.85rem;margin-bottom:18px;line-height:1.6;}
  .summary{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px;}
  .pill{border:1px solid #e5e7eb;border-radius:10px;padding:10px 16px;font-size:.85rem;}
  .pill b{display:block;font-size:1.4rem;}
  table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:6px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eee;}
  th{background:#f8f8fb;text-transform:uppercase;font-size:.72rem;letter-spacing:.04em;color:#555;}
  td.num,th.num{text-align:right;}
  .badge{padding:3px 10px;border-radius:8px;font-size:.72rem;font-weight:700;}
  .badge.ok{background:#d1fae5;color:#065f46;}
  .badge.part{background:#fef3c7;color:#92400e;}
  .badge.pend{background:#e0e7ff;color:#3730a3;}
  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:8px;}
  .pcard{border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;}
  .pcard img{width:100%;display:block;}
  .pcap{padding:8px 10px;font-size:.78rem;color:#333;}
  .muted{color:#888;font-size:.85rem;}
  @media print{body{padding:0;} .pcard{break-inside:avoid;} tr{break-inside:avoid;}}
</style></head><body>
  <h1>AWM Digital Load List — Pick Report</h1>
  <div class="meta">
    Job / Ref No.: <b style="font-size:1.05rem;color:#4f46e5;">${escapeHtml(jobRef || '—')}</b><br>
    Source file: <b>${escapeHtml(importedFileName || '—')}</b><br>
    Generated: ${escapeHtml(generated)}
  </div>
  <div class="summary">
    <div class="pill"><b>${total}</b>Total items</div>
    <div class="pill"><b>${completed}</b>Completed</div>
    <div class="pill"><b>${partial}</b>Partially picked</div>
    <div class="pill"><b>${pending}</b>Pending</div>
  </div>
  <h2>Items</h2>
  <table>
    <thead><tr><th>Item</th><th>SKU</th><th>Location</th><th class="num">Req</th><th class="num">Picked</th><th>Status</th></tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table>
  <h2>Photos (${withPhotos.length})</h2>
  <div class="photos">${photosHtml}</div>
</body></html>`;

            downloadBlob(html, `${baseName()}_pick_report_${fileStamp()}.html`, 'text/html');
        }

        /* ---------- Startup ---------- */
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(20px)';
            setTimeout(() => {
                container.style.transition = 'all 0.6s ease';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);

            loadState();
        });
    </script>
</body>
</html>
</body></html>
